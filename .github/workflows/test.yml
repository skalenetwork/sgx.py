name: Test
on:
  push:
    branches-ignore:
      - "develop"
      - "master"
      - "beta"
      - "stable"

env:
  SGX_WALLET_TAG: 1.11.0-develop.2

jobs:
  test_core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - sgx_wallet_flags: '-s -y'
            expect_zmq_ownership: '0'
          - sgx_wallet_flags: '-s -y -e'
            expect_zmq_ownership: '1'
    env:
      CERT_PATH: ${{ secrets.CERT_PATH }}
      GETH: ${{ secrets.GETH }}
      SERVER: ${{ secrets.SERVER }}
      TEST_ACCOUNT: ${{ secrets.TEST_ACCOUNT }}
      ETH_PRIVATE_KEY: ${{ secrets.ETH_PRIVATE_KEY }}
      SGX_WALLET_FLAGS: ${{ matrix.sgx_wallet_flags }}
      SGX_EXPECT_ZMQ_OWNERSHIP: ${{ matrix.expect_zmq_ownership }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -e .[dev]
      - name: Lint with ruff
        run: |
          ruff check sgx/ tests/
      - name: Run containers
        run: |
          bash scripts/run_sgx_simulator.sh
          mkdir $CERT_PATH
          TEST_ADDRESS=$(python -c 'import os; from eth_account import Account; print(Account.from_key(os.environ["ETH_PRIVATE_KEY"]).address)')
          docker run -d -p 8545:8545 --name anvil ghcr.io/foundry-rs/foundry:v1.9.0 "anvil --host 0.0.0.0 --gas-limit 80000000 --fund-accounts $TEST_ADDRESS:100000000"
          sleep 60
          docker ps -a 
          docker logs anvil --tail 500
      - name: Run tests
        run: |
          py.test tests/ --ignore tests/test_dkg.py
  test_dkg:
    runs-on: ubuntu-24.04
    env:
      CERT_PATH: ${{ secrets.CERT_PATH }}
      GETH: ${{ secrets.GETH }}
      SERVER: ${{ secrets.SERVER }}
      TEST_ACCOUNT: ${{ secrets.TEST_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install -e .[dev]
      - name: Run containers
        run: |
          bash scripts/run_sgx_simulator.sh
          mkdir $CERT_PATH
          sleep 60
      - name: Run tests
        run: |
          pytest ./tests/test_dkg.py
